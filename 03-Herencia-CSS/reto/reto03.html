<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styleR.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Electrolize&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="Icon" href="./imgR/rivals.jpg">
</head>

<body>
    <h1>Reto 03 - Cards Menu</h1>

    <div class="cards-menu">
        <!-- Card 1 -->
        <div class="card">
            <img class="card-bg" src="./imgR/buckyW.jpg" alt="Card1">

            <div class="overlay purple">
                <img class="card-icon" src="./imgR/bucky.png" alt="Icon1">

                <div class="card-content">
                    <p class="card-date">20.02.2019</p>
                    <p class="card-text">
                        Winter Soldier.
                    </p>
                    <a class="card-btn" href="#">Learn More</a>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img class="card-bg" src="./imgR/moonKnightW.png" alt="Card2">

            <div class="overlay gold">
                <img class="card-icon" src="./imgR/moonknight.png" alt="Icon2">

                <div class="card-content">
                    <p class="card-date">20.02.2019</p>
                    <p class="card-text">
                        Moon Knight.
                    </p>
                    <a class="card-btn" href="#">Learn More</a>
                </div>
            </div>
        </div>
        <!-- Card 3 -->
        <div class="card">
            <img class="card-bg" src="./imgR/elsaW.jpg" alt="Card3">

            <div class="overlay red">
                <img class="card-icon" src="./imgR/elsaB.png" alt="Icon3">

                <div class="card-content">
                    <p class="card-date">20.02.2019</p>
                    <p class="card-text">
                        Elsa BloodStone.
                    </p>
                    <a class="card-btn" href="#">Learn More</a>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
